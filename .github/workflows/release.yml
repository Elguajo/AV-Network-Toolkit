name: release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AVNetworkToolkit-package-candidates-${{ github.sha }}
          path: candidates
      - name: Verify source, hash assets and publish requested preview
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          $manifest = Get-Content candidates/package-manifest.json -Raw | ConvertFrom-Json
          if ($manifest.SourceCommit -ne $env:RELEASE_SHA -or $manifest.Version -ne '1.1.2') { throw 'Unexpected release source/version' }
          $assets = @()
          $checksums = @()
          foreach ($file in $manifest.Files) {
            if ($file.Name -ne [IO.Path]::GetFileName($file.Name)) { throw 'Invalid manifest filename' }
            $path = Join-Path candidates $file.Name
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
            if ($hash -ne $file.Sha256) { throw 'Candidate checksum mismatch' }
            $checksums += "$hash  $($file.Name)"
            $assets += $path
          }
          $checksums | Set-Content candidates/SHA256SUMS.txt -Encoding ascii
          $assets += 'candidates/SHA256SUMS.txt'
          $assets += 'candidates/package-manifest.json'
          $tag = 'v' + $manifest.Version
          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            $tagSha = gh api "repos/$env:GITHUB_REPOSITORY/commits/$tag" --jq .sha
            if ($LASTEXITCODE -ne 0 -or $tagSha -ne $env:RELEASE_SHA) { throw 'Existing release/tag targets another source; no tag rewrite' }
            gh release edit $tag --title 'AV Network Toolkit 1.1.2 — Preview' --notes-file docs/releases/v1.1.2.md --prerelease
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --target $env:RELEASE_SHA --title 'AV Network Toolkit 1.1.2 — Preview' --notes-file docs/releases/v1.1.2.md --prerelease
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
